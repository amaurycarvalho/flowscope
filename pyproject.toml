[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowscope"
version = "1.6.0"
description = "Plataforma open source de análise de ativos da B3: fluxo de ordens, fundamentos de ações e FIIs, documentos e notícias regulatórias, com IA opcional"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7,<4",
    "numpy>=2.5.4",
    "Pillow>=13.0.0",
    "pypdf>=6.21.2",
    "pyxclip>=0.2.3",
    "requests>=2.34.2",
    "tkcalendar>=1.6.1",
    "pywin32>=312; sys_platform == 'win32'",
]

[project.optional-dependencies]
llm = [
    "litellm>=1.106.3",
    "regex>=2026.9.29",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "responses>=0.26.3",
    "ruff==0.17.2",
    "flake8>=7.4.1",
    "flake8-bugbear>=26.9.30",
    "flake8-annotations>=3.3.0",
    "flake8-docstrings>=1.7.0",
]
quality = [
    "ruff==0.17.2",
    "flake8>=7.4.1",
    "flake8-bugbear>=26.9.30",
    "flake8-annotations>=3.3.0",
    "flake8-docstrings>=1.7.0",
    "radon>=6.0.1",
    "xenon>=0.9.3",
    "lizard>=1.24.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "mutmut>=3.8.0",
    "semgrep>=1.182.1",
]

[project.scripts]
flowscope = "flowscope.presentation.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
ignore = ["BLE001", "S110", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests marked as slow, deselected by default",
    "llm: tests that exercise the optional LLM layer",
]
addopts = ["-m", "not slow"]

[tool.mutmut]
source_paths = [
    "src/",
]
pytest_add_cli_args_test_selection = [
    "-m",
    "not slow",
    "tests/",
]
pytest_add_cli_args = [
    "-q",
    "--disable-warnings",
]
runner = "pytest"
do_not_mutate = [
    "__init__.py",
    "src/tests/*",
    "tests/*",
    ".*/*",
    "build/*",
    "src/flowscope/presentation/gui/*",
    "src/flowscope/icons/*",
]
do_not_mutate_patterns = [
    'logger\.\w+',
    'raise \w+',
    'len\(double_offsets\)',
    'delta_days == 0',
    'if delta > 0:',
    '_MFV_THRESHOLDS\[-1\]',
    '_CLV_THRESHOLDS\[0\]\[0\]',
    '_CLV_THRESHOLDS\[-1\]',
    '_EFFICIENCY_THRESHOLDS\[0\]\[0\]',
    '_EFFICIENCY_THRESHOLDS\[-1\]',
    'return (ConvictionClassification|DominanceClassification|MoneyFlowClassification)\(label, short, color',
    'write_text\(content, encoding="utf-8"\)',
    'enumerate\(reader, start=2\)',
    '_parse_date\(row\.get\("RptDt"',
]
on_dependency_change = "rerun"
timeout_constant = 1
timeout_multiplier = 10

[tool.coverage.run]
source = ["src"]
omit = [
    "src/flowscope/presentation/gui/*",
    "src/flowscope/icons/*",
]

[tool.coverage.report]
fail_under = 85
