[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowscope"
version = "0.7.0"
description = "Plataforma de análise quantitativa de fluxo de ordens"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.5",
    "Pillow>=9.0",
    "pyxclip>=0.2",
    "requests>=2.28",
    "tkcalendar>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0.0",
    "responses>=0.25",
    "ruff>=0.1.0",
    "flake8>=6.0.0",
    "flake8-bugbear>=23.0.0",
    "flake8-annotations>=3.0.0",
    "flake8-docstrings>=1.7.0",
]
quality = [
    "ruff>=0.1.0",
    "flake8>=6.0.0",
    "flake8-bugbear>=23.0.0",
    "flake8-annotations>=3.0.0",
    "flake8-docstrings>=1.7.0",
    "radon>=6.0.0",
    "xenon>=0.9.0",
    "lizard>=1.17.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mutmut>=3.6.0",
    "semgrep>=1.0.0",
]

[project.scripts]
flowscope = "flowscope.presentation.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
ignore = ["BLE001", "S110", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests marked as slow, deselected by default"]
addopts = ["-m", "not slow"]

[tool.mutmut]
source_paths = [
    "src/",
]
pytest_add_cli_args_test_selection = [
    "-m",
    "not slow",
    "tests/",
]
pytest_add_cli_args = [
    "-q",
    "--disable-warnings",
]
runner = "pytest"
do_not_mutate = [
    "__init__.py",
    "src/tests/*",
    "tests/*",
    ".*/*",
    "build/*",
    "src/flowscope/presentation/gui/*",
    "src/flowscope/icons/*",
]
do_not_mutate_patterns = [
    'logger\.\w+',
    'raise \w+',
    'len\(double_offsets\)',
    'delta_days == 0',
    'if delta > 0:',
    '_MFV_THRESHOLDS\[-1\]',
    '_CLV_THRESHOLDS\[0\]\[0\]',
    '_CLV_THRESHOLDS\[-1\]',
    '_EFFICIENCY_THRESHOLDS\[0\]\[0\]',
    '_EFFICIENCY_THRESHOLDS\[-1\]',
    'return (ConvictionClassification|DominanceClassification|MoneyFlowClassification)\(label, short, color',
    'write_text\(content, encoding="utf-8"\)',
    'enumerate\(reader, start=2\)',
    '_parse_date\(row\.get\("RptDt"',
]
on_dependency_change = "rerun"
timeout_constant = 1
timeout_multiplier = 10

[tool.coverage.run]
source = ["src"]
omit = [
    "src/flowscope/presentation/gui/*",
    "src/flowscope/icons/*",
]

[tool.coverage.report]
fail_under = 85
